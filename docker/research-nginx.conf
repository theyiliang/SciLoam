# Reference only: replace research.example.org and certificate paths before use.
# Put limit_req_zone inside the nginx http context (not inside server).
limit_req_zone $binary_remote_addr zone=research_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=research_api:10m rate=60r/m;

server {
    listen 80;
    server_name research.example.org;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name research.example.org;
    ssl_certificate /etc/letsencrypt/live/research.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/research.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;
    location /api/auth/ {
        limit_req zone=research_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    location /api/ {
        limit_req zone=research_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Streaming responses must not wait for a full proxy buffer. The app
        # sends comment heartbeats; this inactivity timeout exceeds its deadline.
        proxy_buffering off;
        proxy_read_timeout 210s;
        proxy_send_timeout 210s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
